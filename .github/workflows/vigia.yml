# Vigia de fora da Contabo (E00-H27): testa a produção a partir do GitHub.
#
# É a segunda verificação, independente do Uptime Kuma: se a Contabo inteira
# cair, ou a própria máquina do Teleport onde o Kuma roda, o Kuma não avisa, e
# este workflow falha. O GitHub manda e-mail ao Felipe quando um workflow
# agendado falha (Settings > Notifications > Actions, "Only notify for failed
# workflows").
#
# Cada alvo tem três tentativas, com 20 s entre elas, para oscilação de rede
# não virar alarme. Também falha com certificado a menos de 14 dias de vencer.
#
# Roda a cada 5 minutos neste repositório público, que não gasta minutos de
# Actions da organização. Num repositório público o GitHub desliga o
# agendamento depois de 60 dias sem commit: o workflow manutencao faz um
# commit vazio por mês para mantê-lo ligado.
# Também roda à mão (Actions > vigia > Run workflow).

name: vigia

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    name: app, API e Teleport
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Testar
        run: |
          alvos=(
            "Produção · app|https://app.atendoc.com.br"
            "Produção · API|https://api.atendoc.com.br/up"
            "Teleport|https://acesso.atendoc.com.br/web/login"
            "Staging · app|https://app.staging.atendoc.com.br/entrar"
            "Staging · API|https://api.staging.atendoc.com.br/saude"
          )
          falhas=0
          {
            echo "| Alvo | Resultado | Tempo | Certificado |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for alvo in "${alvos[@]}"; do
            nome=${alvo%%|*}
            url=${alvo#*|}
            resultado="falhou"
            tempo="-"
            for tentativa in 1 2 3; do
              if saida=$(curl -sS -o /dev/null -w '%{http_code} %{time_total}' --max-time 15 "$url" 2>&1) &&
                [[ "$saida" =~ ^2[0-9][0-9]\  ]]; then
                resultado="ok (${saida%% *})"
                tempo="${saida#* }s"
                break
              fi
              echo "::warning::$nome: tentativa $tentativa falhou ($saida)"
              if [ "$tentativa" -lt 3 ]; then sleep 20; fi
            done

            host=${url#https://}
            host=${host%%/*}
            validade=$(echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null |
              openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
            if [ -n "$validade" ]; then
              dias=$(( ($(date -d "$validade" +%s) - $(date +%s)) / 86400 ))
              certificado="$dias dias"
              if [ "$dias" -lt 14 ]; then
                echo "::error::$nome: certificado vence em $dias dias"
                falhas=$((falhas + 1))
              fi
            else
              certificado="sem leitura"
            fi

            if [ "$resultado" = "falhou" ]; then
              echo "::error::$nome fora do ar: $url ($saida)"
              falhas=$((falhas + 1))
            fi
            echo "| $nome | $resultado | $tempo | $certificado |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$falhas"
